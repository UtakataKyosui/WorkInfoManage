# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

# Project metadata
type: 'application'
language: 'rust'

# File groups for task inputs
fileGroups:
  sources:
    - 'src/**/*'
    - 'Cargo.toml'
    - 'Cargo.lock'
  configs:
    - '*.toml'
    - '.cargo/**/*'
  web:
    - 'index.html'
    - 'assets/**/*'

# Tasks
tasks:
  # Development tasks
  dev:
    command: 'cargo run'
    inputs:
      - '@group(sources)'
    local: true
    options:
      cache: false
      runInCI: false

  dev-web:
    command: 'bash -c "lsof -ti:8080 | xargs -r kill -9 2>/dev/null || true; sleep 1; trunk serve"'
    inputs:
      - '@group(sources)'
      - '@group(web)'
    local: true
    options:
      cache: false
      runInCI: false

  # Build tasks
  build:
    command: 'cargo build --release'
    inputs:
      - '@group(sources)'
    outputs:
      - 'target/release/work-info-manage'

  build-web:
    command: 'trunk build --release'
    inputs:
      - '@group(sources)'
      - '@group(web)'
    outputs:
      - 'dist/**/*'

  # Check and lint tasks
  check:
    command: 'cargo check --all-targets'
    inputs:
      - '@group(sources)'

  check-web:
    command: 'cargo check --target wasm32-unknown-unknown --bin web_demo'
    inputs:
      - '@group(sources)'

  clippy:
    command: 'cargo clippy --all-targets -- -D warnings'
    inputs:
      - '@group(sources)'

  fmt:
    command: 'cargo fmt --all'
    inputs:
      - '@group(sources)'

  fmt-check:
    command: 'cargo fmt --all -- --check'
    inputs:
      - '@group(sources)'

  # Test tasks
  test:
    command: 'cargo test'
    inputs:
      - '@group(sources)'

  test-integration:
    command: 'cargo test --test input_handling_test'
    inputs:
      - '@group(sources)'
      - 'tests/**/*'

  test-e2e:
    command: 'npm run test:e2e'
    inputs:
      - '@group(sources)'
      - '@group(web)'
      - 'e2e/**/*'
      - 'playwright.config.ts'

  test-e2e-ui:
    command: 'npm run test:e2e:ui'
    local: true
    options:
      cache: false
      runInCI: false

  test-all:
    deps:
      - 'test'
      - 'test-integration'
      - 'test-e2e'

  # Combined tasks
  ci:
    deps:
      - 'fmt-check'
      - 'clippy'
      - 'check'
      - 'check-web'
      - 'test'
      - 'build'

  lint:
    deps:
      - 'fmt-check'
      - 'clippy'
