[workspace]
members = [".", "migration"]

[package]
name = "work-info-manage"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
arboard = "3.6.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.3"
crossterm = "0.28"
dirs = "6.0"
dotenvy = "0.15"
itertools = "0.14.0"
once_cell = "1.19"
pulldown-cmark = "0.12"
ratatui = { version = "0.29", features = ["widget-calendar"] }
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "mock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tui-textarea = { version = "0.7", features = ["search"] }
tui-tree-widget = "0.23.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"
serial_test = "3.0"
