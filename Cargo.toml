[workspace]
members = [".", "migration"]

[package]
name = "work-info-manage"
version = "1.0.0"
edition = "2021"
default-run = "work-info-manage"

[dependencies]
anyhow = "1.0"

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.3"

dirs = "6.0"
dotenvy = "0.15"
itertools = "0.14.0"
once_cell = "1.19"
pulldown-cmark = "0.12"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
ratatui = { version = "0.29", default-features = false, features = ["widget-calendar"] }
tui-textarea = { version = "0.7", default-features = false, features = ["search", "ratatui"] }
tachyonfx = { version = "0.21.0", default-features = false, features = ["dsl", "std"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
sea-orm = { version = "1.1", features = ["macros", "mock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
toml = "0.8"
tui-tree-widget = "0.23.1"
aes-gcm = "0.10.3"
rand = "0.9.2"
base64 = "0.22.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
ratatui = { version = "0.29", features = ["crossterm"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
crossterm = "0.28"
tachyonfx = { version = "0.21.0", features = ["crossterm", "std-duration"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = "0.2.0"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
uuid = { version = "1.0", features = ["js"] }
tachyonfx = { version = "0.21.0", default-features = false, features = ["web-time"] }
web-sys = { version = "0.3", features = ["console", "Window", "Document", "KeyboardEvent"] }
wasm-bindgen = "0.2"

[target.wasm32-unknown-unknown.dependencies]
web-time = "1.1.0"


[dev-dependencies]
tempfile = "3.8"
serial_test = "3.0"
